[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Long-cache the fingerprinted assets Astro emits.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"

# Redirects from the old Weebly URL structure, so existing links and
# search-engine results land somewhere useful instead of a 404.

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/home.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/about.html"
  to = "/#about"
  status = 301

[[redirects]]
  from = "/contact.html"
  to = "/#contact"
  status = 301

[[redirects]]
  from = "/projects.html"
  to = "/#work"
  status = 301

[[redirects]]
  from = "/portfolio.html"
  to = "/#work"
  status = 301

[[redirects]]
  from = "/work"
  to = "/#work"
  status = 301

